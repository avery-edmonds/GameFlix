<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameflix - Browse Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<style>

    .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            margin-bottom: 2rem;
            border: 1px solid #3a3a3a;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.3);
            border-color: var(--primary-orange);
        }

        .game-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .game-card-body {
            padding: 1.25rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .game-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .game-meta {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }

        .game-description {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

</style>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">Gameflix</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="games.html">All Games</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="library.html">My Library</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="lists.html">My Lists</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="friends.html">Friends</a>
                    </li>
                </ul>
                <form class="d-flex me-3" onsubmit="return performSearch(event)">
                    <input class="form-control search-bar" type="search" id="searchInput" placeholder="Search games..." aria-label="Search">
                </form>
                <div class="d-flex align-items-center">
                    <button class="btn btn-primary" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="container-fluid page-header">
        <div class="row align-items-center">
            <div class="col-md-6">
                <h1 class="display-5 fw-bold" id="pageTitle">Browse All Games</h1>
                <p class="lead text">
                    <span id="gameCount">0</span> games available
                </p>
            </div>
            <div class="col-md-6 text-end">
                <select class="sort-dropdown" id="sortSelect" onchange="applySorting()">
                    <option value="title-asc">Title: A-Z</option>
                    <option value="title-desc">Title: Z-A</option>
                    <option value="date-desc">Newest First</option>
                    <option value="date-asc">Oldest First</option>
                    <option value="developer">Developer</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="container-fluid">
        <div class="filter-section">
            <div class="row">
                <div class="col-md-12 mb-3">
                    <h5 class="mb-3">Filter by Genre</h5>
                    <button class="filter-btn active" onclick="filterByGenre(null)">All Games</button>
                    <span id="genreFilters"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Games Grid -->
    <div class="container-fluid">
        <div class="row" id="gamesContainer">
            <div class="loading">
                <div class="spinner-border" role="status"></div>
                <p class="mt-3">Loading games...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allGames = [];
        let filteredGames = [];
        let currentGenreFilter = null;
        let currentSearchTerm = null;
        const API_URL = "http://localhost:8080"

        // Get current user
        const currentUserId = localStorage.getItem('userId');
        const currentUsername = localStorage.getItem('username') || 'Guest';

        // Check URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const genreIdParam = urlParams.get('genreId');
        const searchParam = urlParams.get('search');

        // Load all games
        async function loadGames() {
            try {
                const response = await fetch(`${API_URL}/games`);
                allGames = await response.json();
                filteredGames = [...allGames];
                
                // Apply initial filters from URL
                if (genreIdParam) {
                    currentGenreFilter = parseInt(genreIdParam);
                    applyFilters();
                } else if (searchParam) {
                    currentSearchTerm = searchParam;
                    document.getElementById('searchInput').value = searchParam;
                    searchGames(searchParam);
                } else {
                    displayGames(filteredGames);
                }
                
                updateGameCount();
            } catch (error) {
                console.error('Error loading games:', error);
                document.getElementById('gamesContainer').innerHTML = 
                    '<div class="col-12 no-results">Failed to load games. Please try again.</div>';
            }
        }

        // Load genres for filters
        async function loadGenres() {
            try {
                const response = await fetch(`${API_URL}/genres`);
                const genres = await response.json();
                
                const container = document.getElementById('genreFilters');
                genres.forEach(genre => {
                    const btn = document.createElement('button');
                    btn.className = 'filter-btn';
                    btn.textContent = genre.name;
                    btn.onclick = () => filterByGenre(genre.genreId);
                    
                    // Set active if matches URL param
                    if (genreIdParam && parseInt(genreIdParam) === genre.genreId) {
                        btn.classList.add('active');
                        document.querySelector('.filter-btn[onclick*="null"]').classList.remove('active');
                    }
                    
                    container.appendChild(btn);
                });
            } catch (error) {
                console.error('Error loading genres:', error);
            }
        }

        // Filter by genre
        function filterByGenre(genreId) {
            currentGenreFilter = genreId;
            currentSearchTerm = null;
            document.getElementById('searchInput').value = '';
            
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update URL
            if (genreId) {
                window.history.pushState({}, '', `games.html?genreId=${genreId}`);
            } else {
                window.history.pushState({}, '', 'games.html');
            }
            
            applyFilters();
        }

        // Apply filters
        function applyFilters() {
            if (currentGenreFilter) {
                filteredGames = allGames.filter(game => 
                    game.genre && game.genre.genreId === currentGenreFilter
                );
                
                // Update page title
                const genre = allGames.find(g => g.genre && g.genre.genreId === currentGenreFilter);
                if (genre && genre.genre) {
                    document.getElementById('pageTitle').textContent = `${genre.genre.name} Games`;
                }
            } else {
                filteredGames = [...allGames];
                document.getElementById('pageTitle').textContent = 'Browse All Games';
            }
            
            displayGames(filteredGames);
            updateGameCount();
        }

        // Search games
        async function searchGames(query) {
            try {
                const response = await fetch(`${API_URL}/games/search?title=${encodeURIComponent(query)}`);
                filteredGames = await response.json();
                
                document.getElementById('pageTitle').textContent = `Search Results for "${query}"`;
                displayGames(filteredGames);
                updateGameCount();
                
                // Update URL
                window.history.pushState({}, '', `${API_URL}games.html?search=${encodeURIComponent(query)}`);
            } catch (error) {
                console.error('Error searching games:', error);
            }
        }

        // Perform search
        function performSearch(event) {
            event.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            
            if (query) {
                currentSearchTerm = query;
                currentGenreFilter = null;
                
                searchGames(query);
            }
            return false;
        }

        // Apply sorting
        function applySorting() {
            const sortValue = document.getElementById('sortSelect').value;
            
            switch(sortValue) {
                case 'title-asc':
                    filteredGames.sort((a, b) => a.title.localeCompare(b.title));
                    break;
                case 'title-desc':
                    filteredGames.sort((a, b) => b.title.localeCompare(a.title));
                    break;
                case 'date-desc':
                    filteredGames.sort((a, b) => new Date(b.releaseDate) - new Date(a.releaseDate));
                    break;
                case 'date-asc':
                    filteredGames.sort((a, b) => new Date(a.releaseDate) - new Date(b.releaseDate));
                    break;
                case 'developer':
                    filteredGames.sort((a, b) => (a.developer || '').localeCompare(b.developer || ''));
                    break;
            }
            
            displayGames(filteredGames);
        }

        // Display games
        function displayGames(games) {
            const container = document.getElementById('gamesContainer');
            
            if (games.length === 0) {
                container.innerHTML = `
                    <div class="col-12 no-results">
                        <h3>No games found</h3>
                        <p>Try adjusting your filters or search terms</p>
                        <button class="btn btn-primary mt-3" onclick="window.location.href='games.html'">View All Games</button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            games.forEach(game => {
                container.innerHTML += createGameCard(game);
            });
        }

        // Create game card
        function createGameCard(game) {
            const genreName = game.genre ? game.genre.name : 'Unknown';
            const coverImage = game.coverImage || 'https://via.placeholder.com/300x200';
            const description = game.description || 'No description available';
            const releaseYear = game.releaseDate ? new Date(game.releaseDate).getFullYear() : '';
            
            // Check if game is new (released within last 60 days)
            const isNew = game.releaseDate && 
                (new Date() - new Date(game.releaseDate)) < (60 * 24 * 60 * 60 * 1000);
            
            return `
                <div class="col-md-3 col-sm-6">
                    <div class="game-card" onclick="window.location.href='game-detail.html?id=${game.gameId}'">
                        <img src="${coverImage}" alt="${game.title}">
                        <div class="game-card-body">
                            <div>
                                ${isNew ? '<span class="badge-new">NEW</span>' : ''}
                                <h5 class="game-title">${game.title}</h5>
                            </div>
                            
                            <p class="game-meta">
                                ${genreName}${releaseYear ? ' • ' + releaseYear : ''}
                                ${game.developer ? '<br>' + game.developer : ''}
                            </p>
                            
                            <p class="game-description">${description}</p>
                            
                            <button class="play-btn" onclick="event.stopPropagation(); playGame(${game.gameId})">
                                View Game
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Update game count
        function updateGameCount() {
            document.getElementById('gameCount').textContent = filteredGames.length;
        }

        // Play game
        function playGame(gameId) {
            window.location.href = `game-detail.html?id=${gameId}`;
        }

        // Check authentication
        function checkAuth() {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                window.location.href = 'login.html';
            }
        }

        //Log Out
        async function logout() {
        localStorage.removeItem("userId");
        localStorage.removeItem("username");
        window.location.href="login.html";
      }

        // Initialize
        window.addEventListener('load', function() {
            checkAuth();
            loadGames();
            loadGenres();
        });
    </script>
</body>
</html>
