<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameflix - List Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<style>
    .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-bottom: 2rem;
            border: 1px solid #3a3a3a;
            display: flex;
            flex-direction: row;
            height: 180px;
        }
</style>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">Gameflix</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="games.html">All Games</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="library.html">My Library</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="lists.html">My Lists</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="friends.html">Friends</a>
                    </li>
                </ul>
                <form class="d-flex me-3">
                    <input class="form-control search-bar" type="search" placeholder="Search games..." aria-label="Search">
                </form>
                <div class="d-flex align-items-center">
                    <button class="btn btn-primary" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Loading State -->
    <div id="loadingState" class="container-fluid mt-4">
        <div class="loading">
            <div class="spinner-border" role="status"></div>
            <p class="mt-3">Loading list...</p>
        </div>
    </div>

    <!-- List Content -->
    <div id="listContent" class="container-fluid mt-4" style="display: none;">
        <!-- List Header -->
        <div class="list-header-section">
            <div class="d-flex align-items-start justify-content-between">
                <div>
                    <h1 class="list-title-large" id="listTitle">List Name</h1>
                    <div class="list-stats">
                        <div class="stat-item">
                            <span id="gameCount">0</span> games
                        </div>
                        <div class="stat-item" id="creationDate">
                            Created: -
                        </div>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addGameModal">
                        Add Games
                    </button>
                    <a href="lists.html" class="btn btn-outline-primary">
                        Back to Lists
                    </a>
                </div>
            </div>
        </div>

        <!-- Games in List -->
        <div class="row">
            <div class="col-12" id="gamesContainer">
                <div class="loading">
                    <div class="spinner-border spinner-border-sm" role="status"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Game Modal -->
    <div class="modal fade" id="addGameModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Games to List</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" class="form-control search-bar mb-3" id="gameSearchInput" placeholder="Search games to add...">
                    <div id="gameSearchResults"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const listId = urlParams.get('id');
        const currentUserId = localStorage.getItem('userId');
        const currentUsername = localStorage.getItem('username') || 'Guest';
        const API_URL = "http://localhost:8080";

        let currentList = null;
        let listGames = [];

        // Load list details
        async function loadListDetails() {
            try {
                const response = await fetch(`${API_URL}/api/lists/${listId}`);
                currentList = await response.json();
                
                // Update header
                document.getElementById('listTitle').textContent = currentList.listName;
                
                if (currentList.creationDate) {
                    const date = new Date(currentList.creationDate);
                    document.getElementById('creationDate').textContent = 
                        'Created: ' + date.toLocaleDateString('en-US', { 
                            year: 'numeric', 
                            month: 'long', 
                            day: 'numeric' 
                        });
                }
                
                // Show content
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('listContent').style.display = 'block';
                
            } catch (error) {
                console.error('Error loading list:', error);
                alert('Failed to load list details');
                window.location.href = 'lists.html';
            }
        }

        // Load games in list
        async function loadListGames() {
            try {
                const response = await fetch(`${API_URL}/list-games/list/${listId}`);
                listGames = await response.json();
                
                document.getElementById('gameCount').textContent = listGames.length;
                displayGames(listGames);
            } catch (error) {
                console.error('Error loading games:', error);
                document.getElementById('gamesContainer').innerHTML = 
                    '<div class="text-center text">Failed to load games</div>';
            }
        }

        // Display games
        function displayGames(games) {
            const container = document.getElementById('gamesContainer');
            
            if (games.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>This list is empty</h3>
                        <p class="text">Start adding games to organize your collection</p>
                        <button class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#addGameModal">
                            Add Your First Game
                        </button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            games.forEach(listGame => {
                container.innerHTML += createGameCard(listGame);
            });
        }

        // Create game card
        function createGameCard(listGame) {
            const game = listGame.game;
            const genreName = game.genre ? game.genre.name : 'Unknown';
            const coverImage = game.coverImage || 'https://via.placeholder.com/240x180';
            const addedDate = listGame.added ? 
                new Date(listGame.added).toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                }) : '';
            
            return `
                <div class="game-card">
                    <img src="${coverImage}" alt="${game.title}" onclick="window.location.href='game-detail.html?id=${game.gameId}'">
                    <div class="game-card-body">
                        <div>
                            <h5 class="game-title" onclick="window.location.href='game-detail.html?id=${game.gameId}'">${game.title}</h5>
                            <p class="game-meta">
                                ${genreName}
                                ${game.developer ? ' • ' + game.developer : ''}
                            </p>
                            ${addedDate ? `<p class="added-date">Added: ${addedDate}</p>` : ''}
                        </div>
                        <div class="game-card-actions">
                            <button class="play-btn" onclick="viewGame(${game.gameId})">
                                 View Game
                            </button>
                            <button class="btn-remove" onclick="removeGameFromList(${game.gameId})">
                                Remove
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Remove game from list
        async function removeGameFromList(gameId) {
            if (confirm('Remove this game from the list?')) {
                try {
                    const response = await fetch(`${API_URL}/list-games`, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            list: listId,
                            game: gameId
                        })
                    });
                    
                    if (response.ok) {
                        alert('Game removed from list');
                        loadListGames(); // Reload games
                    } else {
                        alert('Failed to remove game');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Failed to remove game');
                }
            }
        }

        // Play game
        function viewGame(gameId) {
            window.location.href = `${API_URL}game-detail.html?id=${gameId}`;
        }

        // Search games to add
        let searchTimeout;
        document.getElementById('gameSearchInput')?.addEventListener('input', function(e) {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            
            if (query.length < 2) {
                document.getElementById('gameSearchResults').innerHTML = '';
                return;
            }
            
            searchTimeout = setTimeout(() => {
                searchGamesToAdd(query);
            }, 300);
        });

        // Search games
        async function searchGamesToAdd(query) {
            try {
                const response = await fetch(`${API_URL}/games/search?title=${encodeURIComponent(query)}`);
                const games = await response.json();
                
                displaySearchResults(games);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Display search results
        function displaySearchResults(games) {
            const resultsDiv = document.getElementById('gameSearchResults');
            
            if (games.length === 0) {
                resultsDiv.innerHTML = '<p class="text text-center">No games found</p>';
                return;
            }
            
            // Filter out games already in the list
            const gamesInList = listGames.map(lg => lg.game.gameId);
            const availableGames = games.filter(g => !gamesInList.includes(g.gameId));
            
            if (availableGames.length === 0) {
                resultsDiv.innerHTML = '<p class="text text-center">All matching games are already in this list</p>';
                return;
            }
            
            resultsDiv.innerHTML = availableGames.map(game => {
                const coverImage = game.coverImage || 'https://via.placeholder.com/60';
                const genreName = game.genre ? game.genre.name : 'Unknown';
                
                return `
                    <div class="game-search-result" onclick="addGameToList(${game.gameId})">
                        <img src="${coverImage}" class="game-search-thumb" alt="${game.title}">
                        <div>
                            <strong>${game.title}</strong>
                            <div class="small text">${genreName}</div>
                        </div>
                        <span class="added-badge" style="display: none;" id="badge-${game.gameId}">Added!</span>
                    </div>
                `;
            }).join('');
        }

        // Add game to list
        async function addGameToList(gameId) {
            try {
                const response = await fetch(`${API_URL}/list-games`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        list: { listId: parseInt(listId) },
                        game: { gameId: gameId }
                    })
                });
                
                if (response.ok) {
                    document.getElementById('badge-' + gameId).style.display = 'inline-block';
                    setTimeout(() => {
                        loadListGames();
                        document.getElementById('gameSearchInput').value = '';
                        document.getElementById('gameSearchResults').innerHTML = '';
                    }, 1000);
                } else {
                    alert('Failed to add game to list');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to add game to list');
            }
        }

        // Check authentication
        function checkAuth() {
            if (!currentUserId) {
                window.location.href = 'login.html';
            }
        }

        //Log Out
        async function logout() {
        localStorage.removeItem("userId");
        localStorage.removeItem("username");
        window.location.href="login.html";
      }

        // Initialize
        window.addEventListener('load', function() {
            checkAuth();
            
            if (!listId) {
                alert('No list specified');
                window.location.href = 'lists.html';
                return;
            }
            
            loadListDetails();
            loadListGames();
        });
    </script>
</body>
</html>
