<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameflix - My Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<style>
        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            margin-bottom: 2rem;
            border: 1px solid #3a3a3a;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.3);
            border-color: var(--primary-orange);
        }

        .game-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .game-card-body {
            padding: 1.25rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .game-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-size: 1.1rem;
        }

        .game-meta {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }

        .play-btn {
            background-color: var(--primary-orange);
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.3s;
            width: 100%;
            margin-top: auto;
        }

        .play-btn:hover {
            background-color: var(--secondary-orange);
        }

        .btn-remove {
            background-color: transparent;
            border: 1px solid #dc3545;
            color: #dc3545;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: all 0.3s;
            width: 100%;
            margin-top: 0.5rem;
        }

        .btn-remove:hover {
            background-color: #dc3545;
            color: white;
        }

        .list-view .game-card {
            flex-direction: row;
            height: 180px;
        }

        .list-view .game-card img {
            width: 240px;
            height: 100%;
        }

        .list-view .game-card-body {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
        }

        .list-view .game-info {
            flex: 1;
        }

        .list-view .game-actions {
            display: flex;
            flex-direction: row;
            gap: 0.5rem;
            min-width: 200px;
        }

       
</style>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">Gameflix</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="games.html">All Games</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="library.html">My Library</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="lists.html">My Lists</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="friends.html">Friends</a>
                    </li>
                </ul>
                <form class="d-flex me-3" onsubmit="return searchLibrary(event)">
                    <input class="form-control search-bar" type="search" id="searchInput" placeholder="Search library..." aria-label="Search">
                </form>
                <div class="d-flex align-items-center">
                    <button class="btn btn-primary" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="container-fluid page-header">
        <h1 class="display-5 fw-bold">My Library</h1>
        <p class="lead text">Your collection of games</p>
    </div>

    <!-- Stats Section -->
    <div class="container-fluid">
        <div class="stats-section">
            <div class="row">
                <div class="col-md-4">
                    <div class="stat-box">
                        <div class="stat-number" id="totalGames">0</div>
                        <div class="stat-label">Total Games</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-box">
                        <div class="stat-number" id="genresCount">0</div>
                        <div class="stat-label">Different Genres</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-box">
                        <div class="stat-number" id="latestAddition">-</div>
                        <div class="stat-label">Latest Addition</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Filters and View Toggle -->
    <div class="container-fluid">
        <div class="filter-section">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h5 class="mb-3">Sort By</h5>
                    <select class="sort-dropdown" id="sortSelect" onchange="applySorting()">
                        <option value="recent">Recently Added</option>
                        <option value="title-asc">Title: A-Z</option>
                        <option value="title-desc">Title: Z-A</option>
                        <option value="genre">Genre</option>
                        <option value="oldest">Oldest First</option>
                    </select>
                </div>
                <div class="col-md-6 text-end">
                    <label class="me-2">View:</label>
                    <div class="view-toggle d-inline-flex">
                        <button class="view-btn active" onclick="setView('grid')">Grid</button>
                        <button class="view-btn" onclick="setView('list')">List</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Games Grid -->
    <div class="container-fluid">
        <div class="row" id="gamesContainer">
            <div class="loading">
                <div class="spinner-border" role="status"></div>
                <p class="mt-3">Loading your library...</p>
            </div>
        </div>
    </div>

    <!--"Game" window-->
    <iframe id="video"
        frameborder="0"
        allowfullscreen
        style="display:none; width:100%; height:100vh;">
    </iframe>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const currentUserId = localStorage.getItem('userId');
        const currentUsername = localStorage.getItem('username') || 'Guest';
        const API_URL = "http://localhost:8080";

        console.log(currentUserId);
        console.log(currentUsername);
        

        let libraryGames = [];
        let filteredLibrary = [];

        // Load user library
        async function loadLibrary() {
            try {
                const response = await fetch(`${API_URL}/libraries/user/${currentUserId}`);
                libraryGames = await response.json();
                filteredLibrary = [...libraryGames];
                
                displayLibrary(filteredLibrary);
                updateStats();
            } catch (error) {
                console.error('Error loading library:', error);
                document.getElementById('gamesContainer').innerHTML = 
                    '<div class="col-12 text-center text py-5">Failed to load library</div>';
            }
        }

        // Display library
        function displayLibrary(libraries) {
            const container = document.getElementById('gamesContainer');
            
            if (libraries.length === 0) {
                container.innerHTML = `
                    <div class="col-12 empty-state">
                        <h3>Your library is empty</h3>
                        <p class="text">Start playing games to build your collection</p>
                        <button class="btn btn-primary mt-3" onclick="window.location.href='games.html'">
                            Browse Games
                        </button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            libraries.forEach(library => {
                container.innerHTML += createGameCard(library);
            });
        }

        // Create game card
        function createGameCard(library) {
            const game = library.game;
            const genreName = game.genre ? game.genre.name : 'Unknown';
            const coverImage = game.coverImage || 'https://via.placeholder.com/300x200';
            const purchaseDate = library.purchaseDate ? 
                new Date(library.purchaseDate).toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                }) : 'Unknown';
            
            return `
                <div class="col-md-3 col-sm-6">
                    <div class="game-card" onclick="window.location.href='game-detail.html?id=${game.gameId}'">
                        <img src="${coverImage}" alt="${game.title}">
                        <div class="game-card-body">
                            <div>
                                <h5 class="game-title">${game.title}</h5>
                                <p class="game-meta">
                                    ${genreName}
                                    ${game.developer ? ' • ' + game.developer : ''}
                                </p>
                                <div class="purchase-date">
                                    Added: ${purchaseDate}
                                </div>
                            </div>
                            
                            <button class="play-btn" onclick="event.stopPropagation(); playGame(${game.gameId})">
                                Play Now
                            </button>
                            <button class="btn-remove" onclick="event.stopPropagation(); removeFromLibrary(${library.libraryId})">
                                Remove from Library
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Update stats
        function updateStats() {
            // Total games
            document.getElementById('totalGames').textContent = libraryGames.length;
            
            // Count unique genres
            const genres = new Set(libraryGames.map(lib => 
                lib.game.genre ? lib.game.genre.name : 'Unknown'
            ));
            document.getElementById('genresCount').textContent = genres.size;
            
            // Latest addition
            if (libraryGames.length > 0) {
                const latest = [...libraryGames].sort((a, b) => 
                    new Date(b.purchaseDate) - new Date(a.purchaseDate)
                )[0];
                
                const daysAgo = Math.floor(
                    (new Date() - new Date(latest.purchaseDate)) / (1000 * 60 * 60 * 24)
                );
                
                if (daysAgo === 0) {
                    document.getElementById('latestAddition').textContent = 'Today';
                } else if (daysAgo === 1) {
                    document.getElementById('latestAddition').textContent = 'Yesterday';
                } else if (daysAgo < 30) {
                    document.getElementById('latestAddition').textContent = daysAgo + ' days ago';
                } else {
                    document.getElementById('latestAddition').textContent = new Date(latest.purchaseDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                }
            }
        }

        // Apply sorting
        function applySorting() {
            const sortValue = document.getElementById('sortSelect').value;
            
            switch(sortValue) {
                case 'recent':
                    filteredLibrary.sort((a, b) => 
                        new Date(b.purchaseDate) - new Date(a.purchaseDate)
                    );
                    break;
                case 'title-asc':
                    filteredLibrary.sort((a, b) => 
                        a.game.title.localeCompare(b.game.title)
                    );
                    break;
                case 'title-desc':
                    filteredLibrary.sort((a, b) => 
                        b.game.title.localeCompare(a.game.title)
                    );
                    break;
                case 'genre':
                    filteredLibrary.sort((a, b) => {
                        const genreA = a.game.genre ? a.game.genre.name : 'Unknown';
                        const genreB = b.game.genre ? b.game.genre.name : 'Unknown';
                        return genreA.localeCompare(genreB);
                    });
                    break;
                case 'oldest':
                    filteredLibrary.sort((a, b) => 
                        new Date(a.purchaseDate) - new Date(b.purchaseDate)
                    );
                    break;
            }
            
            displayLibrary(filteredLibrary);
        }

        // Search library
        function searchLibrary(event) {
            event.preventDefault();
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!query) {
                filteredLibrary = [...libraryGames];
            } else {
                filteredLibrary = libraryGames.filter(lib => 
                    lib.game.title.toLowerCase().includes(query) ||
                    (lib.game.genre && lib.game.genre.name.toLowerCase().includes(query)) ||
                    (lib.game.developer && lib.game.developer.toLowerCase().includes(query))
                );
            }
            
            displayLibrary(filteredLibrary);
            return false;
        }

        // Set view (grid/list)
        function setView(view) {
            const container = document.getElementById('gamesContainer');
            const buttons = document.querySelectorAll('.view-btn');
            
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (view === 'list') {
                container.classList.add('list-view');
                container.querySelectorAll('.col-md-3').forEach(col => {
                    col.className = 'col-12';
                });
            } else {
                container.classList.remove('list-view');
                container.querySelectorAll('.col-12').forEach(col => {
                    col.className = 'col-md-3 col-sm-6';
                });
            }
        }

        // Play game
        async function playGame(gameId) {
            try {
                const response = await fetch(`${API_URL}/games/${gameId}`, {
                    method: 'GET'
                });

                const data = await response.json();

                if(data.title === "Resident Evil"){
                    window.location.href = "steam://run/304240"
                }else{
                window.location.href = data.link;
                }

            } catch (error) {
                console.error("Error loading game:", error);
            }
        }

        

        // Remove from library
        async function removeFromLibrary(libraryId) {
            if (confirm('Are you sure you want to remove this game from your library?')) {
                try {
                    const response = await fetch(`${API_URL}/libraries/${libraryId}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        alert('Game removed from library');
                        loadLibrary(); // Reload library
                    } else {
                        alert('Failed to remove game');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Failed to remove game');
                }
            }
        }

        //Log Out
        async function logout() {
        localStorage.removeItem("userId");
        localStorage.removeItem("username");
        window.location.href="login.html";
      }

        // Check authentication
        function checkAuth() {
            if (!currentUserId) {
                window.location.href = 'login.html';
            }
        }

        // Initialize
        window.addEventListener('load', function() {
            checkAuth();
            loadLibrary();
        });
    </script>
</body>
</html>
