<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameflix - My Lists</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">Gameflix</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="games.html">All Games</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="library.html">My Library</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="lists.html">My Lists</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="friends.html">Friends</a>
                    </li>
                </ul>
                <form class="d-flex me-3" th:action="@{/games/search}" method="get">
                    <input class="form-control search-bar" type="search" name="title" placeholder="Search games..." aria-label="Search">
                </form>
                <div class="d-flex align-items-center">
                    <button class="btn btn-primary" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="container-fluid page-header">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h1 class="display-5 fw-bold">My Game Lists</h1>
                <p class="lead text">Organize your games into custom collections</p>
            </div>
            <div class="col-md-4 text-end">
                <button class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#createListModal">
                    Create New List
                </button>
            </div>
        </div>
    </div>

    <!-- Lists Grid -->
    <div class="container-fluid">
        <div class="row" id="listsContainer">
            <div class="loading">
                <div class="spinner-border" role="status"></div>
                <p class="mt-3">Loading your lists...</p>
            </div>
        </div>
    </div>

    <!-- Create List Modal -->
    <div class="modal fade" id="createListModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New List</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="createListForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="listName" class="form-label">List Name</label>
                            <input type="text" class="form-control" id="listName" required placeholder="e.g., Wishlist, Favorites, To Play">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create List</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const currentUserId = localStorage.getItem('userId');
        const currentUsername = localStorage.getItem('username') || 'Guest';
        const API_URL = "http://localhost:8080";

        let userLists = [];

        
        // Load user lists
        async function loadLists() {
            try {
                const response = await fetch(`${API_URL}/api/lists/user/${currentUserId}`);
                userLists = await response.json();
                
                // Load game counts and thumbnails for each list
                for (let list of userLists) {
                    await loadListGames(list);
                }
                
                displayLists(userLists);
            } catch (error) {
                console.error('Error loading lists:', error);
                document.getElementById('listsContainer').innerHTML = 
                    '<div class="col-12 text-center text py-5">Failed to load lists</div>';
            }
        }

        // Load games for a specific list
        async function loadListGames(list) {
            try {
                const response = await fetch(`${API_URL}/list-games/list/${list.listId}`);
                const listGames = await response.json();
                
                list.gameCount = listGames.length;
                list.gameThumbnails = listGames.slice(0, 4).map(lg => 
                    lg.game.coverImage || 'https://via.placeholder.com/80'
                );
            } catch (error) {
                console.error('Error loading list games:', error);
                list.gameCount = 0;
                list.gameThumbnails = [];
            }
        }

        // Display lists
        function displayLists(lists) {
            const container = document.getElementById('listsContainer');
            
            if (lists.length === 0) {
                container.innerHTML = `
                    <div class="col-12 empty-state">
                        <h3>No lists yet</h3>
                        <p class="text">Create your first list to start organizing your games</p>
                        <button class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#createListModal">
                            Create Your First List
                        </button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <div class="col-lg-4 col-md-6">
                    <div class="create-list-card" data-bs-toggle="modal" data-bs-target="#createListModal">
                        <h3>Create New List</h3>
                        <p class="text">Organize games your way</p>
                    </div>
                </div>
            `;
            
            lists.forEach(list => {
                container.innerHTML += createListCard(list);
            });
        }

        // Create list card
        function createListCard(list) {
            const creationDate = list.creationDate ? 
                new Date(list.creationDate).toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                }) : 'Unknown';
            
            let thumbnailsHtml = '';
            if (list.gameThumbnails && list.gameThumbnails.length > 0) {
                thumbnailsHtml = '<div class="list-games-preview">';
                list.gameThumbnails.forEach(thumb => {
                    thumbnailsHtml += `<img src="${thumb}" class="list-game-thumb" alt="Game">`;
                });
                thumbnailsHtml += '</div>';
            }
            
            return `
                <div class="col-lg-4 col-md-6">
                    <div class="list-card" onclick="viewList(${list.listId})">
                        <div class="list-header">
                            <h3 class="list-title">${list.listName}</h3>
                        </div>
                        
                        <div class="list-meta">
                            ${list.gameCount || 0} games • Created ${creationDate}
                        </div>
                        
                        ${thumbnailsHtml}
                        
                        <div class="list-actions" onclick="event.stopPropagation()">
                            <button class="btn-list-action" onclick="viewList(${list.listId})">
                                View
                            </button>
                            <button class="btn-list-action text-danger" onclick="deleteList(${list.listId})">
                                Delete
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // View list
        function viewList(listId) {
            window.location.href = `list-detail.html?id=${listId}`;
        }

        // Delete list
        async function deleteList(listId) {
            if (confirm('Are you sure you want to delete this list? This action cannot be undone.')) {
                try {
                    const response = await fetch(`${API_URL}/api/lists/${listId}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        alert('List deleted successfully');
                        loadLists(); // Reload lists
                    } else {
                        alert('Failed to delete list');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Failed to delete list');
                }
            }
        }

        // Create list form submission
        document.getElementById('createListForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const listName = document.getElementById('listName').value;
            
            try {
                const response = await fetch(`${API_URL}/api/lists`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user: { id: parseInt(currentUserId) },
                        listName: listName,
                        creationDate: new Date().toISOString()
                    })
                });
                
                if (response.ok) {
                    alert('List created successfully!');
                    bootstrap.Modal.getInstance(document.getElementById('createListModal')).hide();
                    document.getElementById('listName').value = '';
                    loadLists(); // Reload lists
                } else {
                    alert('Failed to create list');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to create list');
            }
        });

        // Check authentication
        function checkAuth() {
            if (!currentUserId) {
                window.location.href = 'login.html';
            }
        }

        //Log Out
        async function logout() {
        localStorage.removeItem("userId");
        localStorage.removeItem("username");
        window.location.href="login.html";
      }

        // Initialize
        window.addEventListener('load', function() {
            checkAuth();
            loadLists();
        });
    </script>
</body>
</html>
