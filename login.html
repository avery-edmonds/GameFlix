<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameflix - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="loginstyles.css" rel="stylesheet">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="logo">
            <h1>Gameflix</h1>
            <p>Stream. Play. Anywhere.</p>
        </div>

        <!-- Alert Messages -->
        <div id="alertMessage" class="alert"></div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username"
                       placeholder="Enter your username" required autofocus>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-login" id="loginBtn" style="background-color: #ff6b35; color: white; ">Login</button>
        </form>

        <!-- Divider -->
        <div class="divider">
            <span>or</span>
        </div>

        <!-- Sign Up Link -->
        <div class="text-center-link">
            Don't have an account?
            <a href="register.html" class="link-text">Sign up</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const alertMessage = document.getElementById('alertMessage');

    const API_URL = "http://localhost:8080"

    // Check for success message from registration
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('registered') === 'true') {
        showAlert('Account created successfully! Please login.', 'success');
    }

    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        console.log(username);
        console.log(password);

        // Disable button and show loading
        loginBtn.disabled = true;
        loginBtn.textContent = 'Logging in...';

        try{
             const response = await fetch(`${API_URL}/api/login?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`,{
                method: "POST"
                

            });

            if (response.ok) {
                const user = await response.json();
                alert("Logged in as: " + user.username);

                console.log(user.userId);

                localStorage.setItem("userId", user.id);
                localStorage.setItem("username", user.username);
                window.location.href = "dashboard.html";
                
            } else {
                showAlert("Login failed. Check your username and password.", 'danger');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        } catch (error) {
            console.error('Error:', error);
            showAlert("An error occured while logging in", 'danger');
            loginBtn.disabled = false;
            loginBtn.textContent = 'Login';
        }
    });

    function showAlert(message, type) {
        alertMessage.textContent = message;
        alertMessage.className = 'alert alert-' + type;
        alertMessage.style.display = 'block';
    }


</script>
</body>
</html>
