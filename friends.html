<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameflix - Friends</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">Gameflix</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="games.html">All Games</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="library.html">My Library</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="lists.html">My Lists</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="friends.html">Friends</a>
                    </li>
                </ul>
                <form class="d-flex me-3">
                    <input class="form-control search-bar" type="search" placeholder="Search games..." aria-label="Search">
                </form>
                <div class="d-flex align-items-center">
                    <button class="btn btn-primary" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="container-fluid page-header">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h1 class="display-5 fw-bold">My Friends</h1>
                <p class="lead text">Connect with other gamers</p>
            </div>
            <div class="col-md-4 text-end">
                <button class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#addFriendModal">
                    Add Friend
                </button>
            </div>
        </div>
    </div>

    <!-- Stats Section -->
    <div class="container-fluid">
        <div class="stats-section">
            <div class="row">
                <div class="col-md-4">
                    <div class="stat-box">
                        <div class="stat-number" id="totalFriends">0</div>
                        <div class="stat-label">Total Friends</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-box">
                        <div class="stat-number" id="oldestFriend">-</div>
                        <div class="stat-label">Oldest Friendship</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-box">
                        <div class="stat-number" id="newestFriend">-</div>
                        <div class="stat-label">Newest Friend</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Friends List -->
    <div class="container-fluid">
        <div class="row">
            <div class="col-12" id="friendsContainer">
                <div class="loading">
                    <div class="spinner-border" role="status"></div>
                    <p class="mt-3">Loading friends...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Friend Modal -->
    <div class="modal fade" id="addFriendModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Friend</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="userSearchInput" class="form-label">Search Users</label>
                        <input type="text" class="form-control" id="userSearchInput" placeholder="Search by username...">
                        <small class="text">Search for users to add as friends</small>
                    </div>
                    <div id="userSearchResults"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const currentUserId = localStorage.getItem('userId');
        const currentUsername = localStorage.getItem('username') || 'Guest';
        const API_URL = "http://localhost:8080"

        let friends = [];

        let userSearchTimeout;
        document.getElementById('userSearchInput')?.addEventListener('input', function(e) {
            clearTimeout(userSearchTimeout);
            const query = e.target.value.trim();
            
            if (query.length < 2) {
                document.getElementById('userSearchResults').innerHTML = '';
                return;
            }
            
            userSearchTimeout = setTimeout(() => {
                searchUsers(query);
            }, 300);
});

        // Load friends
        async function loadFriends() {
            try {
                const response = await fetch(`${API_URL}/friends/${currentUserId}`);
                friends = await response.json();
                
                displayFriends(friends);
                updateStats();
            } catch (error) {
                console.error('Error loading friends:', error);
                document.getElementById('friendsContainer').innerHTML = 
                    '<div class="text-center text py-5">Failed to load friends</div>';
            }
        }

        // Display friends
        function displayFriends(friendsList) {
            const container = document.getElementById('friendsContainer');
            
            if (friendsList.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No friends yet</h3>
                        <p class="text">Start connecting with other gamers on Gameflix</p>
                        <button class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#addFriendModal">
                            Add Your First Friend
                        </button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            friendsList.forEach(friend => {
                container.innerHTML += createFriendCard(friend);
            });
        }

        // Create friend card
        function createFriendCard(friend) {
            const friendsSince = friend.friendsSince ? 
                new Date(friend.friendsSince).toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                }) : 'Unknown';
            
            // Calculate days since friendship
            let friendshipDuration = '';
            if (friend.friendsSince) {
                const days = Math.floor(
                    (new Date() - new Date(friend.friendsSince)) / (1000 * 60 * 60 * 24)
                );
                
                if (days === 0) {
                    friendshipDuration = 'Friends since Today';
                } else if (days < 30) {
                    friendshipDuration = `Friends for ${days} day${days > 1 ? 's' : ''}`;
                } else if (days < 365) {
                    const months = Math.floor(days / 30);
                    friendshipDuration = `Friends for ${months} month${months > 1 ? 's' : ''}`;
                } else {
                    const years = Math.floor(days / 365);
                    friendshipDuration = `Friends for ${years} year${years > 1 ? 's' : ''}`;
                }
            }
            
            const user = friend.friend;

            return `
                <div class="friend-card">
                    <div class="friend-header">
                        <div class="friend-info">
                            <div class="friend-name">${user.username}</div>
                            <div class="friend-meta">${friendshipDuration}</div>
                            <div class="friends-since">Friends since: ${friendsSince}</div>
                        </div>
                        <div class="friend-actions">
                            <button class="btn-friend-action btn-remove" onclick="removeFriend(${friend.friendId})">
                                Remove Friend
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Update stats
        function updateStats() {
            // Total friends
            document.getElementById('totalFriends').textContent = friends.length;
            
            if (friends.length > 0) {
                // Sort by friendsSince
                const sortedFriends = [...friends].sort((a, b) => 
                    new Date(a.friendsSince) - new Date(b.friendsSince)
                );
                
                // Oldest friendship
                const oldest = sortedFriends[0];
                if (oldest.friendsSince) {
                    const days = Math.floor(
                        (new Date() - new Date(oldest.friendsSince)) / (1000 * 60 * 60 * 24)
                    );
                    
                    if (days < 30) {
                        document.getElementById('oldestFriend').textContent = days + ' days';
                    } else if (days < 365) {
                        document.getElementById('oldestFriend').textContent = Math.floor(days / 30) + ' months';
                    } else {
                        document.getElementById('oldestFriend').textContent = Math.floor(days / 365) + ' years';
                    }
                }
                
                // Newest friendship
                const newest = sortedFriends[sortedFriends.length - 1];
                if (newest.friendsSince) {
                    const days = Math.floor(
                        (new Date() - new Date(newest.friendsSince)) / (1000 * 60 * 60 * 24)
                    );
                    
                    if (days === 0) {
                        document.getElementById('newestFriend').textContent = 'Today';
                    } else if (days < 7) {
                        document.getElementById('newestFriend').textContent = days + ' days ago';
                    } else {
                        document.getElementById('newestFriend').textContent = new Date(newest.friendsSince).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                    }
                }
            }
        }

        //Search for users
        async function searchUsers(username) {
            if (!username.trim()) {
            document.getElementById("userSearchResults").innerHTML = "";
            return;
            }

            console.log(username)

            try {
                const response = await fetch(`${API_URL}/friends/search?username=${encodeURIComponent(username)}`);
                const users = await response.json();
                displaySearchResults(users);
            } catch (error) {
                console.error(error);
                document.getElementById("userSearchResults").innerHTML =
                    `<div class="text-secondary">Error searching users.</div>`;
            }
        }

        //Display Search Results
        function displaySearchResults(users) {
            const container = document.getElementById("userSearchResults");
            container.innerHTML = "";

            if (users.length === 0) {
                container.innerHTML = `<div class="text-secondary mt-2">No users found.</div>`;
                return;
            }

            users.forEach(user => {
                container.innerHTML += `
                    <div class="user-search-result" onclick="addFriend(${user.id})">
                        <div class="user-info-search">
                            <img src="https://www.oshkoshymca.org/sites/oshkoshymca_d10/files/styles/media_full/public/2024-03/person_icon_teaser.png.webp?itok=snMKqGSP" class="user-avatar" />
                            <div>
                                <div>${user.username}</div>
                            </div>
                        </div>
                        <button class="btn btn-success btn-sm">Add</button>
                    </div>
                `;
            });
        }

        // Add friend
        async function addFriend(friendId) {
            
            if (!friendId) {
                alert('Please enter a User ID');
                return;
            }
            
            if (parseInt(friendId) === parseInt(currentUserId)) {
                alert('You cannot add yourself as a friend');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/friends`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        userId: parseInt(currentUserId),
                        friendId: parseInt(friendId),
                        friendsSince: new Date().toISOString()
                    })
                });
                
                if (response.ok) {
                    alert('Friend added successfully!');
                    bootstrap.Modal.getInstance(document.getElementById('addFriendModal')).hide();
                    loadFriends(); // Reload friends
                } else {
                    alert('Failed to add friend. They may already be in your friends list.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to add friend');
            }

            loadFriends();
        }

        // Remove friend
        function removeFriend(friendId) {
            if (!confirm("Are you sure you want to remove this friend?")) return;

            fetch(`${API_URL}/friends/${currentUserId}/${friendId}`, {
                method: "DELETE"
            })
            .then(response => {
                if (!response.ok) throw new Error("Failed to remove friend");
                // Remove from frontend
                friends = friends.filter(f => f.friendId !== friendId);
                displayFriends(friends);
                updateStats();
            })
            .catch(err => {
                console.error(err);
                alert("Could not remove friend");
            });

            loadFriends();

        }

        //Log Out
        async function logout() {
        localStorage.removeItem("userId");
        localStorage.removeItem("username");
        window.location.href="login.html";
      }


        // Check authentication
        function checkAuth() {
            if (!currentUserId) {
                window.location.href = 'login.html';
            }
        }

        // Initialize
        window.addEventListener('load', function() {
            checkAuth();
            loadFriends();
        });
    </script>
</body>
</html>
