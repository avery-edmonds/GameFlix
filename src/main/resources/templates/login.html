<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameflix - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #ff6b35;
            --secondary-orange: #ff8c42;
            --dark-bg: #1a1a1a;
            --card-bg: #2d2d2d;
            --hover-bg: #3a3a3a;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            max-width: 450px;
            width: 100%;
            padding: 2rem;
        }

        .login-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 3rem;
            border: 1px solid #3a3a3a;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-orange);
            margin-bottom: 0.5rem;
        }

        .logo p {
            color: var(--text-secondary);
            margin: 0;
        }

        .form-label {
            color: var(--text-primary);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-control {
            background-color: var(--hover-bg);
            border: 1px solid #4a4a4a;
            color: var(--text-primary);
            padding: 0.75rem;
            border-radius: 8px;
        }

        .form-control:focus {
            background-color: var(--hover-bg);
            border-color: var(--primary-orange);
            color: var(--text-primary);
            box-shadow: 0 0 0 0.2rem rgba(255, 107, 53, 0.25);
        }

        .form-control::placeholder {
            color: var(--text-secondary);
        }

        .btn-login {
            background-color: var(--primary-orange);
            border: none;
            color: white;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            transition: background-color 0.3s;
        }


        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .form-check-input {
            background-color: var(--hover-bg);
            border-color: #4a4a4a;
        }

        .form-check-input:checked {
            background-color: var(--primary-orange);
            border-color: var(--primary-orange);
        }

        .form-check-input:focus {
            box-shadow: 0 0 0 0.2rem rgba(255, 107, 53, 0.25);
        }

        .form-check-label {
            color: var(--text-primary);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #4a4a4a;
        }

        .divider span {
            padding: 0 1rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .link-text {
            color: var(--primary-orange);
            text-decoration: none;
            transition: color 0.3s;
            cursor: pointer;
        }

        .link-text:hover {
            color: var(--secondary-orange);
        }

        .text-center-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-secondary);
        }

        .alert {
            background-color: var(--hover-bg);
            border: 1px solid #4a4a4a;
            border-radius: 8px;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
            padding: 1rem;
            display: none;
        }

        .alert-danger {
            border-color: #dc3545;
            background-color: rgba(220, 53, 69, 0.1);
            color: #ff6b6b;
            display: block;
        }

        .alert-success {
            border-color: #28a745;
            background-color: rgba(40, 167, 69, 0.1);
            color: #6bff6b;
            display: block;
        }

        .forgot-password {
            text-align: right;
            margin-top: 0.5rem;
        }

        .forgot-password a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
            cursor: pointer;
        }

        .forgot-password a:hover {
            color: var(--primary-orange);
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="logo">
            <h1>Gameflix</h1>
            <p>Stream. Play. Anywhere.</p>
        </div>

        <!-- Alert Messages -->
        <div id="alertMessage" class="alert"></div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username"
                       placeholder="Enter your username" required autofocus>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-login" id="loginBtn" style="background-color: #ff6b35; color: white; ">Login</button>
        </form>

        <!-- Divider -->
        <div class="divider">
            <span>or</span>
        </div>

        <!-- Sign Up Link -->
        <div class="text-center-link">
            Don't have an account?
            <a href="register.html" class="link-text">Sign up</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const alertMessage = document.getElementById('alertMessage');

    // Check for success message from registration
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('registered') === 'true') {
        showAlert('Account created successfully! Please login.', 'success');
    }

    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        console.log(username);
        console.log(password);

        // Disable button and show loading
        loginBtn.disabled = true;
        loginBtn.textContent = 'Logging in...';

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const data = await response.json();

            if (response.ok && data.message) {
                // Store token or session info if needed

                // Check the message to determine success
                if (data.message.toLowerCase().includes('success') ||
                    data.message.toLowerCase().includes('login successful')) {
                    showAlert('Login successful! Redirecting...', 'success');

                    // Redirect to dashboard after short delay
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 1000);
                } else {
                    // Message indicates failure
                    showAlert(data.message, 'danger');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
            } else {
                showAlert(data.message || 'Login failed. Please try again.', 'danger');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        } catch (error) {
            console.error('Error:', error);
            showAlert('An error occurred. Please try again.', 'danger');
            loginBtn.disabled = false;
            loginBtn.textContent = 'Login';
        }
    });

    function showAlert(message, type) {
        alertMessage.textContent = message;
        alertMessage.className = 'alert alert-' + type;
        alertMessage.style.display = 'block';
    }


</script>
</body>
</html>
